# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Baseline evaluation v2 - equivalent evidence and exact output formatting

prompts:
  - id: financial-report-question
    label: Financial report question
    raw: "{{test}}"

providers:
  - id: file://provider.py
    label: Baseline LangGraph agent

defaultTest:
  options:
    provider: openai:gpt-5-mini

tests:
  - file://generate_tests.py:generate_tests

evaluateOptions:
  maxConcurrency: 1
  timeoutMs: 300000
  showProgressBar: true

writeLatestResults: true

